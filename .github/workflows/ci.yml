name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  #RUN ALL TESTS
  test:
    name: Run tests
    runs-on: ubuntu-latest

    # Services - spin up real docker container alongside app
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: inspection_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          [5432]

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          [5672]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        env:
          # These overrides application.prperties during CI
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/inspection_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          # Secrets stored in github
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run:
          mvn test --batch-mode

      # Upload test results as downloadable artifacts
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test_report
          path: target/surefire-reports/

  #Build the jar - only runs if tests passed
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn package -DskipTests --batch-mode

      #Save the JAR so later jobs (like deploy) can use it
      - name: Upload JAR artificat
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 5

  # Code quality checks
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run checkstyle
        run: mvn checkstyle:check --batch-mode
        continue-on-error: true

