name: Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn package -DskipTests --batch-mode

      # Ensure the staging directory exists before SCP runs
      - name: Prepare staging directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PRODUCTION_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -rf /tmp/sailbslsafety-deploy
            mkdir -p /tmp/sailbslsafety-deploy

      - name: Copy JAR to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_PRODUCTION_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/tmp/sailbslsafety-deploy/"
          strip_components: 1

      - name: SSH and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PRODUCTION_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            NEW_JAR=$(ls /tmp/sailbslsafety-deploy/*.jar 2>/dev/null | head -n 1)
            if [ -z "$NEW_JAR" ]; then
              echo "::error::No JAR was uploaded"
              exit 1
            fi
            echo "New JAR: $NEW_JAR"

            sudo mv -f "$NEW_JAR" /opt/sailbslsafety/app.jar
            rm -rf /tmp/sailbslsafety-deploy

            sudo systemctl restart sailbslsafety

            echo "Waiting for app to start..."
            for i in $(seq 1 24); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null; then
                echo "App is up after ~$((i * 5)) seconds"
                exit 0
              fi
              echo "Attempt $i/24 failed, retrying in 5s..."
              sleep 5
            done

            echo "::error::App failed to start after 120 seconds"
            sudo journalctl -u sailbslsafety --since "2 minutes ago" --no-pager
            exit 1