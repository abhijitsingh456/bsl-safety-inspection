name: Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn package -DskipTests --batch-mode

      - name: Copy JAR to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_PRODUCTION_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/opt/sailbslsafety/"
          strip_components: 1

      - name: SSH and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PRODUCTION_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mv /opt/sailbslsafety/*.jar /opt/sailbslsafety/app.jar 2>/dev/null || true
            sudo systemctl restart sailbslsafety
            sleep 15
            curl -f http://localhost:8080/actuator/health || exit 1
            echo "Production deployment successful!"