spring:
  application:
    name: inspection

  profiles:
    active: local

  servlet:
    multipart:
      max-file-size: 20 MB
      max-request-size: 50 MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  server:
    port: 8081
    address: 127.0.0.1

    health:
      show-details: never


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

