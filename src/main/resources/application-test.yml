#matches the CI service containers

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inspection_test}
    username: ${SPRING_DATASOURCE_USERNAME:test}
    password: ${SPRING_DATASOURCE_PASSWORD:test}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 20 MB
      max-request-size: 50 MB

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: guest
    password: guest

    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000

  jpa:
    hibernate:
      ddl-auto: create-drop

cloudinary:
  asset-folder: test